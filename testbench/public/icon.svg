<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4f0"/><stop offset="1" stop-color="#d9d5ce"/>
    </linearGradient>
    <radialGradient id="pit" cx="50%" cy="50%" r="50%">
      <stop offset=".72" stop-color="#1a1b1d"/><stop offset="1" stop-color="#2b2c2f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset=".74" stop-color="#ff9a4d" stop-opacity="1"/><stop offset=".86" stop-color="#ff6a1a" stop-opacity=".9"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cap" cx="42%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e6e7ea"/><stop offset="1" stop-color="#c9ccd1"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="62%" r="60%">
      <stop offset="0" stop-color="#f1f2f4"/><stop offset=".7" stop-color="#e2e4e7"/><stop offset="1" stop-color="#f7f8f9"/>
    </radialGradient>
    <pattern id="knurl" width="256" height="256" patternUnits="userSpaceOnUse">
      <g transform="translate(128 132)" stroke="#bfc2c7" stroke-width="2.2">
        <path d="M0 -70V-58M0 70V58" id="k"/>
      </g>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="halo" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3c2f22" flood-opacity=".35"/></filter>
  </defs>

  <!-- porcelain tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#body)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="57.25" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="none" stroke="#b9b3aa" stroke-opacity=".55" stroke-width="1"/>

  <!-- recessed pit with orange underglow -->
  <circle cx="128" cy="132" r="88" fill="#cfcac2" opacity=".55" filter="url(#soft)"/>
  <circle cx="128" cy="128" r="86" fill="url(#pit)"/>
  <circle cx="128" cy="128" r="80" fill="url(#glow)" filter="url(#soft)"/>

  <!-- knurled light rim + face -->
  <g filter="url(#drop)">
    <circle cx="128" cy="128" r="68" fill="url(#cap)"/>
    <g stroke="#b8bbc1" stroke-width="2.4" stroke-linecap="round">
      <g id="ticks">
        <line x1="128" y1="62" x2="128" y2="71"/><line x1="128" y1="62" x2="128" y2="71" transform="rotate(10 128 128)"/>
        <line x1="128" y1="62" x2="128" y2="71" transform="rotate(20 128 128)"/><line x1="128" y1="62" x2="128" y2="71" transform="rotate(30 128 128)"/>
        <line x1="128" y1="62" x2="128" y2="71" transform="rotate(40 128 128)"/><line x1="128" y1="62" x2="128" y2="71" transform="rotate(50 128 128)"/>
      </g>
      <use href="#ticks" transform="rotate(60 128 128)"/><use href="#ticks" transform="rotate(120 128 128)"/>
      <use href="#ticks" transform="rotate(180 128 128)"/><use href="#ticks" transform="rotate(240 128 128)"/><use href="#ticks" transform="rotate(300 128 128)"/>
    </g>
    <circle cx="128" cy="128" r="54" fill="url(#face)"/>
    <ellipse cx="114" cy="100" rx="26" ry="13" fill="#ffffff" opacity=".85" transform="rotate(-24 114 100)"/>
  </g>

  <!-- indicator: orange LED at about 1 o'clock -->
  <circle cx="156" cy="90" r="9" fill="#ff6a1a"/>
  <circle cx="156" cy="90" r="15" fill="#ff6a1a" opacity=".4" filter="url(#halo)"/>
</svg>
